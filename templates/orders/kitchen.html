{% load tz %}
<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kitchen Display System | DineQR</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .order-card { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        @keyframes border-flash {
            0%, 100% { border-color: #f43f5e; box-shadow: 0 0 0 0px rgba(244, 63, 94, 0.2); }
            50% { border-color: #be123c; box-shadow: 0 0 0 4px rgba(244, 63, 94, 0.1); }
        }
        .urgent-card { animation: border-flash 2s infinite; background-color: #fff1f2 !important; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        @media print {
            body * { visibility: hidden; }
            .printable-ticket, .printable-ticket * { visibility: visible; }
            .printable-ticket { position: absolute; left: 0; top: 0; width: 100%; }
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 font-sans antialiased min-h-screen">

    <div id="kds-toast-container" class="fixed top-24 right-6 z-[100] flex flex-col gap-3 pointer-events-none w-80"></div>

    <!-- Navigation Header -->
    <nav class="bg-white/95 backdrop-blur-md shadow-sm sticky top-0 z-50 border-b border-gray-100">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-4">
                <span class="text-xl font-serif font-bold text-gray-900 flex items-center gap-2">
                    <div class="bg-orange-600 text-white p-1.5 rounded-lg"><i data-lucide="chef-hat" class="w-4 h-4"></i></div>
                    dineQR <span class="text-orange-600 font-sans text-sm ml-0.5">Kitchen</span>
                </span>
            </div>

            <div class="flex items-center gap-3">
                <!-- Audio Enable Button -->
                <button id="audio-toggle-btn" onclick="toggleAudioState()" class="bg-gray-100 hover:bg-gray-200 text-gray-700 text-xs font-bold px-3 py-2 rounded-xl flex items-center gap-1.5 border border-gray-200">
                    <i data-lucide="volume-x" id="audio-icon" class="w-4 h-4"></i>
                    <span id="audio-status-text">Audio Off</span>
                </button>

                <!-- Recall History Modal Trigger -->
                <button onclick="toggleRecallModal(true)" class="bg-gray-100 hover:bg-gray-200 text-gray-700 text-xs font-bold px-3 py-2 rounded-xl flex items-center gap-1.5 border border-gray-200">
                    <i data-lucide="history" class="w-4 h-4"></i>
                    <span>Recall</span>
                </button>

                <!-- Waiter Call -->
                <button onclick="executeWaiterSummon('KITCHEN','')" class="bg-gray-900 hover:bg-orange-600 text-white text-[10px] font-bold px-4 py-2 rounded-xl flex items-center gap-1.5 uppercase">
                    <i data-lucide="bell" class="w-3.5 h-3.5"></i>
                    <span class="hidden md:inline">Call Waiter</span>
                </button>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 py-6 space-y-6">

        <!-- Station Filter Bar -->
        <div class="flex items-center gap-2 overflow-x-auto no-scrollbar border-b border-gray-200 pb-3">
            <span class="text-xs font-bold text-gray-400 uppercase tracking-wider mr-2">Stations:</span>
            <button onclick="setStation('ALL')" class="station-tab bg-orange-600 text-white px-3 py-1.5 rounded-xl text-xs font-bold" data-station="ALL">All</button>
            <button onclick="setStation('Mains')" class="station-tab bg-gray-100 text-gray-600 px-3 py-1.5 rounded-xl text-xs font-bold" data-station="Mains">Mains</button>
            <button onclick="setStation('Snacks')" class="station-tab bg-gray-100 text-gray-600 px-3 py-1.5 rounded-xl text-xs font-bold" data-station="Snacks">Snacks</button>
            <button onclick="setStation('Bar')" class="station-tab bg-gray-100 text-gray-600 px-3 py-1.5 rounded-xl text-xs font-bold" data-station="Bar">Bar</button>
            <button onclick="setStation('DESSERT')" class="station-tab bg-gray-100 text-gray-600 px-3 py-1.5 rounded-xl text-xs font-bold" data-station="DESSERT">Desserts</button>
        </div>

        <!-- Consolidation Bar -->
        <div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-200">
            <h2 class="text-[10px] font-bold tracking-widest text-gray-400 uppercase mb-3">Item Consolidation</h2>
            <div id="consolidation-container" class="flex flex-wrap gap-2"></div>
        </div>

        <!-- Tickets Grid -->
        <div id="orders-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-5"></div>
    </main>

    <!-- Recall Modal Drawer -->
    <div id="recall-modal" class="fixed inset-0 bg-black/50 z-[100] hidden flex justify-end">
        <div class="bg-white w-full max-w-md h-full p-6 space-y-4 overflow-y-auto">
            <div class="flex justify-between items-center border-b pb-3">
                <h3 class="font-serif font-bold text-lg">Recently Completed Tickets</h3>
                <button onclick="toggleRecallModal(false)" class="p-1 hover:bg-gray-100 rounded-lg"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            <div id="recall-list" class="space-y-3"></div>
        </div>
    </div>

    <audio id="order-chime" src="https://assets.mixkit.co/active_storage/sfx/1390/1390-preview.mp3" preload="auto"></audio>

    <script>
        let currentStation = 'ALL';
        let knownOrderIds = new Set();
        let isAudioEnabled = false;

        const csrfToken = '{{ csrf_token }}';

        // Toggle Audio Autoplay
        function toggleAudioState() {
            const chime = document.getElementById('order-chime');
            isAudioEnabled = !isAudioEnabled;

            const icon = document.getElementById('audio-icon');
            const text = document.getElementById('audio-status-text');

            if (isAudioEnabled) {
                chime.play().then(() => chime.pause()).catch(() => {});
                text.innerText = "Audio On";
                icon.setAttribute('data-lucide', 'volume-2');
            } else {
                text.innerText = "Audio Off";
                icon.setAttribute('data-lucide', 'volume-x');
            }
            lucide.createIcons();
        }

        function setStation(station) {
            currentStation = station;
            document.querySelectorAll('.station-tab').forEach(tab => {
                if (tab.dataset.station === station) {
                    tab.className = 'station-tab bg-orange-600 text-white px-3 py-1.5 rounded-xl text-xs font-bold';
                } else {
                    tab.className = 'station-tab bg-gray-100 text-gray-600 px-3 py-1.5 rounded-xl text-xs font-bold';
                }
            });
            fetchOrders();
        }

        // --- AJAX POLLING LOOP ---
        async function fetchOrders() {
            try {
                const response = await fetch(`/api/kitchen/orders/?station=${currentStation}`);
                if (!response.ok) return;

                const data = await response.json();
                renderConsolidation(data.summary);
                renderOrders(data.orders);

                // Sound trigger on new orders
                let hasNewOrder = false;
                data.orders.forEach(o => {
                    if (!knownOrderIds.has(o.id)) {
                        knownOrderIds.add(o.id);
                        hasNewOrder = true;
                    }
                });

                if (hasNewOrder && isAudioEnabled) {
                    document.getElementById('order-chime')?.play().catch(() => {});
                }
            } catch (err) {
                console.error("Polling error:", err);
            }
        }

        function renderConsolidation(summary) {
            const container = document.getElementById('consolidation-container');
            if (!summary.length) {
                container.innerHTML = `<p class="text-xs text-gray-400 font-bold uppercase">No active dishes in preparation.</p>`;
                return;
            }

            container.innerHTML = summary.map(item => `
                <div class="bg-gray-50 border border-gray-200 px-3 py-1.5 rounded-xl flex items-center gap-2">
                    <span class="bg-gray-900 text-white text-[10px] font-bold px-2 py-0.5 rounded-lg">${item.total_qty}</span>
                    <span class="text-gray-700 font-bold text-[10px] uppercase">${item.menu_item__name}</span>
                </div>
            `).join('');
        }

        function renderOrders(orders) {
            const grid = document.getElementById('orders-grid');
            if (!orders.length) {
                grid.innerHTML = `<div class="col-span-full py-16 text-center border border-dashed rounded-2xl bg-white"><p class="text-gray-400 text-xs uppercase font-bold">All Stations Clear</p></div>`;
                return;
            }

            grid.innerHTML = orders.map(order => {
                const createdTime = new Date(order.created_at);
                const diffMins = Math.max(0, Math.floor((new Date() - createdTime) / 60000));

                let timerBorder = "border-l-emerald-500";
                let timerText = "text-emerald-600";
                let urgentClass = "";

                if (diffMins >= 15) {
                    timerBorder = "border-l-rose-500";
                    timerText = "text-rose-600";
                    urgentClass = "urgent-card";
                } else if (diffMins >= 8) {
                    timerBorder = "border-l-amber-500";
                    timerText = "text-amber-600";
                }

                return `
                    <div class="order-card bg-white rounded-2xl shadow-sm border border-gray-200 border-l-4 ${timerBorder} ${urgentClass} flex flex-col h-full overflow-hidden">
                        <div class="p-4 bg-gray-50/50 border-b flex justify-between items-start">
                            <div>
                                <h3 class="font-serif font-bold text-lg">${order.table_number === 0 ? 'Counter' : 'Table ' + order.table_number}</h3>
                                <p class="text-[9px] font-bold text-gray-400 uppercase">Order #${order.id}</p>
                            </div>
                            <div class="text-right">
                                <span class="text-[10px] font-bold uppercase tracking-wider ${timerText}">${diffMins} MINS</span>
                                <button onclick="printTicket(${order.id})" class="ml-2 p-1 text-gray-400 hover:text-gray-600" title="Print KOT"><i data-lucide="printer" class="w-3.5 h-3.5"></i></button>
                            </div>
                        </div>

                        <!-- ITEMS LIST -->
                        <div class="p-4 flex-grow space-y-2 overflow-y-auto max-h-[300px]">
                            ${order.items.map(item => {
                                const isPreparing = item.status === 'preparing';
                                return `
                                    <div class="flex items-center justify-between p-2 rounded-xl transition-colors ${isPreparing ? 'bg-amber-50 border border-amber-200' : 'bg-gray-50'}">
                                        <div class="flex items-center gap-2.5 min-w-0">
                                            <input type="checkbox" ${isPreparing ? 'checked' : ''}
                                                onchange="toggleItemStatus(${item.id}, this.checked)"
                                                class="w-4 h-4 accent-amber-600 rounded cursor-pointer">
                                            <div class="min-w-0">
                                                <p class="text-xs font-bold uppercase ${isPreparing ? 'text-amber-900' : 'text-gray-900'}">
                                                    ${item.quantity}x ${item.name}
                                                </p>
                                                ${item.notes ? `<p class="text-[10px] text-rose-600 font-bold uppercase">${item.notes}</p>` : ''}
                                            </div>
                                        </div>
                                        <span class="text-[9px] font-bold uppercase px-2 py-0.5 rounded-md ${isPreparing ? 'bg-amber-200 text-amber-800' : 'bg-gray-200 text-gray-600'}">
                                            ${isPreparing ? 'Preparing' : 'Received'}
                                        </span>
                                    </div>
                                `;
                            }).join('')}
                        </div>

                        <!-- MAIN CARD BUTTON (Bumps/Vanishes Order) -->
                        <div class="p-3 bg-gray-50 border-t">
                            <button onclick="completeOrder(${order.id})" class="w-full bg-emerald-600 hover:bg-emerald-700 active:scale-[0.98] text-white py-2.5 rounded-xl font-bold text-xs uppercase tracking-wider transition-all shadow-sm flex items-center justify-center gap-1.5">
                                <i data-lucide="check-circle" class="w-4 h-4"></i>
                                Ready for Pickup
                            </button>
                        </div>
                    </div>
                `;
            }).join('');

            lucide.createIcons();
        }

        // --- 0. Notification Toast Helper (Prevents ReferenceError) ---
        function showKitchenToast(message, type = 'success') {
            const container = document.getElementById('kds-toast-container');
            if (!container) {
                console.log(`[Toast ${type}]: ${message}`);
                return;
            }

            const el = document.createElement('div');
            el.className = `p-4 text-[10px] font-bold uppercase tracking-widest rounded-2xl border shadow-xl flex items-center gap-2.5 transition-all duration-300 ${
                type === 'success' ? 'bg-gray-900 border-gray-800 text-white' : 'bg-rose-50 border-rose-200 text-rose-700'
            }`;
            el.textContent = message;

            container.appendChild(el);
            setTimeout(() => el.remove(), 3000);
        }

        // --- 1. Checkbox Toggle: Toggles item between 'preparing' and 'received' ---
        async function toggleItemStatus(itemId, isChecked) {
            const statusToSend = isChecked ? 'preparing' : 'received';

            await fetch(`/api/kitchen/item-status/${itemId}/`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': csrfToken
                },
                body: JSON.stringify({ status: statusToSend })
            });

            // Refresh display (ticket stays on screen!)
            fetchOrders();
        }

        // Update complete order status
        async function updateOrderStatus(orderId, status) {
            try {
                const response = await fetch(`/update_order_status/${orderId}/`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': csrfToken,
                        'X-Requested-With': 'XMLHttpRequest'
                    },
                    body: JSON.stringify({ status: status })
                });

                if (!response.ok) {
                    const data = await response.json().catch(() => ({}));
                    showKitchenToast(data.message || 'Failed to bump ticket.', 'error');
                    return;
                }

                showKitchenToast(`Order #${orderId} cleared!`, 'success');

                // Immediately refresh orders on screen
                fetchOrders();
            } catch (error) {
                console.error("Bump Error:", error);
                showKitchenToast('Network error while bumping ticket.', 'error');
            }
        }

        // --- 2. Complete Order Function (Fixes 404 & ReferenceError) ---
        async function completeOrder(orderId) {
            try {
                // Dynamically generates the exact Django URL from urls.py
                const baseUrl = "{% url 'update_order_status' 0 %}";
                const targetUrl = baseUrl.replace('/0/', `/${orderId}/`);

                const response = await fetch(targetUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': csrfToken,
                        'X-Requested-With': 'XMLHttpRequest'
                    },
                    body: JSON.stringify({ status: 'ready' })
                });

                if (response.ok) {
                    showKitchenToast(`Order #${orderId} marked Ready!`, 'success');
                    // Re-fetch orders so the completed ticket vanishes from the screen
                    fetchOrders();
                } else {
                    const data = await response.json().catch(() => ({}));
                    showKitchenToast(data.message || 'Failed to complete order.', 'error');
                }
            } catch (err) {
                console.error("Error completing order:", err);
                showKitchenToast('Network error while completing order.', 'error');
            }
        }


        // Recall Modal Handling
        async function toggleRecallModal(show) {
            const modal = document.getElementById('recall-modal');
            modal.classList.toggle('hidden', !show);
            if (show) {
                const res = await fetch('/api/kitchen/recent-completed/');
                const data = await res.json();
                const list = document.getElementById('recall-list');

                if (!data.completed_orders.length) {
                    list.innerHTML = `<p class="text-xs text-gray-400">No recently completed orders found.</p>`;
                    return;
                }

                list.innerHTML = data.completed_orders.map(o => `
                    <div class="p-3 border border-gray-200 rounded-xl flex items-center justify-between">
                        <div>
                            <p class="font-bold text-xs">Table ${o.table_number} (Order #${o.id})</p>
                            <p class="text-[10px] text-gray-500 truncate max-w-[200px]">${o.items_summary}</p>
                        </div>
                        <button onclick="recallOrder(${o.id})" class="bg-gray-900 text-white px-2.5 py-1 rounded-lg text-[10px] font-bold uppercase">Recall</button>
                    </div>
                `).join('');
            }
        }

        // Fixes Call Waiter URL and handles response toasts
        async function executeWaiterSummon(tableNumber, reasonCode = "help") {
            try {
                const callWaiterUrl = "{% url 'call_waiter_api' %}";

                // Map 'KITCHEN' or blank values to 0
                const targetTable = (tableNumber === 'KITCHEN' || !tableNumber) ? 0 : tableNumber;

                const response = await fetch(callWaiterUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': csrfToken
                    },
                    body: JSON.stringify({
                        table_number: targetTable,
                        reason: reasonCode || "help"
                    })
                });

                const data = await response.json().catch(() => ({}));

                if (!response.ok) {
                    showKitchenToast(data.message || 'Call waiter failed.', 'error');
                    return;
                }

                const alertMsg = (targetTable === 0 || targetTable === '0')
                    ? "Waiter called to Kitchen!"
                    : `Waiter dispatched to Table ${targetTable}`;

                showKitchenToast(alertMsg, 'success');
            } catch (err) {
                console.error("Waiter Call Error:", err);
                showKitchenToast('Network error calling waiter.', 'error');
            }
        }

        async function recallOrder(orderId) {
            await fetch(`/api/kitchen/recall/${orderId}/`, {
                method: 'POST',
                headers: { 'X-CSRFToken': csrfToken }
            });
            toggleRecallModal(false);
            fetchOrders();
        }

        // Ticket Print Hook
        function printTicket(orderId) {
            window.print();
        }

        // Start 5-second polling loop
        fetchOrders();
        setInterval(fetchOrders, 5000);
        lucide.createIcons();
    </script>
</body>
</html>
